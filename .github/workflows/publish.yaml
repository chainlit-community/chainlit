name: Publish
run-name: Publish ${{ inputs.version }} to ${{ inputs.index }}

# Publishes an official version (alpha, beta, release candidate or final;
# never a dev build) of the chainlit-community package. Run by hand only; see
# RELENG.md.
#
# The version typed here is stamped at build time; nothing is committed. Full
# CI runs on exactly the files that are then uploaded, with PyPI trusted
# publishing (no tokens). The trusted publisher registered on PyPI and
# TestPyPI names THIS file and the environment of the upload job, and trusted
# publishing does not work from a reusable workflow, so the upload job must
# stay in this file.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish: the version in backend/chainlit/version.py
          (3.0.0) or an alpha, beta or release candidate of it (3.0.0a0,
          3.0.0b1, 3.0.0rc1).
        required: true
        type: string
      index:
        description: Package index. PyPI is only allowed from main.
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    # Builds the release with the typed version and runs every check on it.
    # scripts/ci_version.py refuses, in the build job, a version that is not
    # allowed: wrong shape, not a release of version.py, already tagged, PyPI
    # from another branch than main, or a final without its release notes.
    uses: ./.github/workflows/ci.yaml
    secrets: inherit
    # ci.yaml's attest job asks for the last two; a called workflow cannot
    # hold more permissions than its caller.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      release_version: ${{ inputs.version }}
      index: ${{ inputs.index }}

  upload:
    name: Upload to ${{ inputs.index }}
    needs: [ci]
    # scripts/ci_version.py already refuses a PyPI build from another branch,
    # but that script comes from the dispatched ref; this check and the
    # deployment branch rule of the `pypi` environment do not.
    if: inputs.index != 'pypi' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # explicit, so that `-o pipefail` is set
    # The environment is part of what PyPI trusts. On `pypi` its required
    # reviewers are the approval gate for the release.
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/project/chainlit-community/' || 'https://test.pypi.org/project/chainlit-community/' }}
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out scripts/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Download the distributions built for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Validate the build and select the files for the index
        run: |
          # --kind official: built by this run, for this commit, with exactly
          # the typed version; --verify-dist checks the files against
          # SHA256SUMS.
          fields="$(python3 -I scripts/release_notes.py validate dist/build-info.json \
            --kind official --expect-version "$VERSION" --expect-sha "$GITHUB_SHA" \
            --expect-run-id "$GITHUB_RUN_ID" --verify-dist dist)"
          echo "$fields"
          # Only the wheel and the sdist go to the index; dist/ also holds the
          # react-client tarball, SHA256SUMS and build-info.json.
          mkdir pypi-dist
          cp "dist/$(sed -n 's/^wheel=//p' <<<"$fields")" "dist/$(sed -n 's/^sdist=//p' <<<"$fields")" pypi-dist/
          ls -l pypi-dist
      - name: Publish package distributions to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist
          repository-url: https://test.pypi.org/legacy/
      - name: Publish package distributions to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist

  github-release:
    # A separate job, so that "Re-run failed jobs" can redo it without
    # uploading again. TestPyPI rehearsals create no tag and no release.
    name: Draft the GitHub release
    needs: [upload]
    if: inputs.index == 'pypi'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # explicit, so that `-o pipefail` is set
    permissions:
      contents: write # create the draft release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out scripts/ and the release notes sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            docs/releases
            CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the distributions built for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Validate the build
        id: info
        run: |
          python3 -I scripts/release_notes.py validate dist/build-info.json \
            --kind official --expect-version "$VERSION" --expect-sha "$GITHUB_SHA" \
            --expect-run-id "$GITHUB_RUN_ID" --verify-dist dist | tee -a "$GITHUB_OUTPUT"
      - name: Write the release notes
        run: |
          # Final: docs/releases/<version>.md and its changelog section.
          # Pre-release: the changelog's Unreleased section. Then how to
          # install and verify.
          python3 -I scripts/release_notes.py official dist/build-info.json \
            --repo "$GH_REPO" --index pypi --expect-version "$VERSION" \
            --expect-sha "$GITHUB_SHA" --expect-run-id "$GITHUB_RUN_ID" >"$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
          WHEEL: ${{ steps.info.outputs.wheel }}
          SDIST: ${{ steps.info.outputs.sdist }}
          REACT_CLIENT: ${{ steps.info.outputs.react_client }}
        working-directory: dist
        run: |
          # Idempotent for re-runs. The list includes drafts, which have no
          # tag yet and so cannot be found by tag.
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg version "$VERSION" '.[] | select(.tag_name == $version) | .html_url' | sed -n 1p)"
          if [[ -n "$existing" ]]; then
            echo "A release for $VERSION already exists: $existing"
            exit 0
          fi
          # A draft: a maintainer reviews the notes and publishes it, which
          # creates the tag on the commit this run built. A pre-release must
          # never become the "Latest" release.
          flags=(--draft --target "$GITHUB_SHA" --title "Chainlit $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" "${flags[@]}" "$WHEEL" "$SDIST" "$REACT_CLIENT" SHA256SUMS
