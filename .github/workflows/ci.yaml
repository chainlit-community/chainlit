name: CI

on:
  workflow_call:
    inputs:
      # Set by publish.yaml only: build an official release instead of a
      # preview build. scripts/ci_version.py holds the rules.
      release_version:
        description: Exact version of the official release to build, e.g. 3.0.0rc1.
        type: string
        default: ''
      index:
        description: Package index the release is for (testpypi or pypi).
        type: string
        default: ''
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [main, dev, 'release/**']
  push:
    branches: [main, dev, 'release/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# Least privilege: jobs that need more ask for it themselves. Workflows that
# call this one (publish.yaml, publish-libs.yaml) must grant what the attest
# job asks for, because a called workflow cannot hold more than its caller.
permissions:
  contents: read

jobs:
  check-backend:
    uses: ./.github/workflows/check-backend.yaml
    secrets: inherit
  check-frontend:
    uses: ./.github/workflows/check-frontend.yaml
    secrets: inherit
  tests:
    uses: ./.github/workflows/tests.yaml
    secrets: inherit
  build:
    uses: ./.github/workflows/build.yaml
    with:
      release_version: ${{ inputs.release_version }}
      index: ${{ inputs.index }}
  e2e-tests:
    # Tests the wheel from the `dist` artifact uploaded by the build job.
    needs: [build]
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
  attest:
    # Build provenance for the distributions that preview-release.yaml
    # and publish.yaml publish. It is signed here, in the run that built
    # them, so that it names the commit they were built from. Only for builds
    # that passed every check and get published: pushes to main (previews) and
    # official releases for PyPI. This job never runs build code.
    name: Attest build provenance
    if: >-
      github.repository == 'chainlit-community/chainlit' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (inputs.release_version != '' && inputs.index == 'pypi'))
    needs: [check-backend, check-frontend, tests, build, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - name: Download the distributions built for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums
        run: sha256sum --check --strict SHA256SUMS
        working-directory: dist
      # One attestation whose subjects are exactly the files in SHA256SUMS.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
  ci:
    runs-on: ubuntu-slim
    name: Run CI
    if: always() # This ensures the job always runs
    needs: [check-backend, check-frontend, tests, build, e2e-tests, attest]
    steps:
      # Propagate failure
      - name: Check dependent jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'action_required') || contains(needs.*.result, 'timed_out')
        run: |
          echo "Not all required jobs succeeded"
          exit 1
