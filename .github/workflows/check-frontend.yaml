name: Check frontend & libs

on: [workflow_call]

permissions:
  contents: read

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Linting: frontend'
            command: pnpm lint
          - name: 'Formatting: frontend'
            command: pnpm format-check
          - name: 'Type checking: frontend'
            command: pnpm type-check
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.
      - name: Build @chainlit/react-client
        run: pnpm --filter @chainlit/react-client build
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  check-pnpm-overrides:
    name: 'Lockfile: pnpm overrides'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - run: node scripts/check-pnpm-overrides.mjs
