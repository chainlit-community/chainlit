name: Publish libs

# Not set up for this fork: @chainlit/react-client is not published to npm yet
# (no credentials are configured, so a real run fails at authentication). Manual
# runs only; GitHub releases do not trigger it.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test publishing)'
        required: false
        default: false
        type: boolean

permissions: read-all

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-slim
    steps:
      - name: Validate publishing branch and destination package index
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            if [[ "${{ inputs.dry_run }}" != "true" ]]; then
              echo "❌ Error: Only a build from the main branch can be published to npm registry."
              echo "Please check 'Dry run (test publishing)' when running from branch: ${{ github.ref_name }}"
              exit 1
            fi
          fi
          echo "✅ Validation passed"
  ci:
    needs: [validate]
    uses: ./.github/workflows/ci.yaml
    secrets: inherit
    # ci.yaml's attest job asks for these (it only runs for pushes to main);
    # a called workflow cannot hold more permissions than its caller.
    permissions:
      contents: read
      id-token: write
      attestations: write
  build-n-publish:
    name: Upload libs release to npm registry
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.

      - name: Build react-client
        run: pnpm --filter @chainlit/react-client build

      - name: Publish packages to npm
        # --no-git-checks allows testing from non-main branches and publishing from release tags
        run: pnpm publish --recursive --no-git-checks ${{ inputs.dry_run && '--dry-run' || '' }}
